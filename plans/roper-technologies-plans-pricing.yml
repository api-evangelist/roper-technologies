description: >-
  Roper Technologies (NASDAQ: ROP) is a diversified technology holding company. There is no
  Roper-branded API or pricing surface; commercial terms are set independently by each
  operating subsidiary (Aderant, Clinisys, Deltek, Vertafore, Frontline, IntelliTrans,
  ConstructConnect, DAT, iPipeline, etc.).
notes: >-
  No unified Roper API or pricing exists. Pricing must be reconciled in each subsidiary's own
  repo/portal. This artifact carries a single contact-sales placeholder.
