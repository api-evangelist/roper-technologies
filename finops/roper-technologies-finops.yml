description: >-
  Roper Technologies is a diversified holding company. FinOps treatment must be applied at
  the subsidiary level (Aderant, Deltek, Vertafore, etc.); no Roper-level billing surface
  exists.
notes: >-
  No unified billing model. Each subsidiary issues its own invoices under its own legal
  entity.
sources:
  - https://www.ropertech.com/businesses
billingModel:
  pricingCategory: Varies by Subsidiary
  billingFrequency: Varies
  billingCurrency: USD
  chargeCategories:
    - Purchase
focusColumns:
  ServiceName: Roper Technologies (multi-subsidiary)
  ServiceCategory: Vertical SaaS Holding
  ProviderName: Roper Technologies
  PublisherName: Roper Technologies, Inc.
  BillingCurrency: USD
meters:
  - name: subsidiary_charges
    description: Aggregate of charges from Roper operating subsidiaries
    unit: varies
    aggregation: sum
    dimensions:
      - subsidiary
      - product
principles:
  - name: Visibility
    description: >-
      Roll up subsidiary-level invoices (Aderant, Deltek, Vertafore, Clinisys) into a single
      Roper view; the parent does not publish an aggregated usage feed.
  - name: Allocation
    description: >-
      Allocate each subsidiary's spend to the consuming vertical (legal, healthcare,
      construction, insurance) rather than treating Roper as one bucket.
  - name: Optimization
    description: >-
      Negotiate at the subsidiary level; cross-subsidiary leverage is limited by the holding
      company's decentralized model.
  - name: Accountability
    description: >-
      Vertical leadership (legal, healthcare, construction, etc.) owns the corresponding
      Roper-subsidiary contract.
